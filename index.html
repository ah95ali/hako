        function getSpecs(deviceId) {
            const specs = deviceDb[deviceId];
            if (!specs) return '<p class="p-3 text-slate-400 text-xs text-center">لا توجد مواصفات فنية متاحة لهذا الجهاز.</p>';

            let tableHtml = '<table class="w-full spec-table text-right text-xs sm:text-sm text-slate-300 border border-slate-800 rounded-lg overflow-hidden">';
            tableHtml += `
                <thead>
                    <tr class="bg-slate-800 text-slate-100 font-bold border-b border-slate-700">
                        <th class="w-1/2 p-2.5 text-brand-orange border-l border-slate-700">المواصفات</th>
                        <th class="w-1/2 p-2.5 text-brand-orange">القيمة</th>
                    </tr>
                </thead>
                <tbody>
            `;

            specs.forEach(([name, value]) => {
                tableHtml += `
                    <tr>
                        <td class="font-semibold text-slate-100 border-l border-slate-800">${name}</td>
                        <td class="font-mono text-slate-300">${value}</td>
                    </tr>
                `;
            });

            tableHtml += '</tbody></table>';
            return tableHtml;
        }

        function openLightbox(src, title, specsHtml) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const modalTitle = document.getElementById('modal-title');
            const specsContainer = document.getElementById('modal-specs-container');

            lightboxImg.src = src;
            modalTitle.innerText = title || '';
            specsContainer.innerHTML = specsHtml || '';

            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
